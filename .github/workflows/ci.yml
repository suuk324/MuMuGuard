name: CI

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Encoding check (PS 5.1 needs UTF-8 BOM)
        shell: powershell
        run: .\Check-BOM.ps1

      - name: Syntax check
        shell: powershell
        run: .\tests\Check-Syntax.ps1

      - name: Unit tests
        shell: powershell
        run: .\tests\Run-Tests.ps1

      - name: Bundle smoke test
        shell: powershell
        run: |
          .\build\bundle.ps1
          if (-not (Test-Path _build\MuMuGuard.bundle.ps1)) { exit 1 }
          Write-Host "bundle ok"